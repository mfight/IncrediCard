name: Demo

# Builds the site and publishes it to GitHub Pages on every push to main:
# the landing page at the root, and the Storybook (the demo and the docs)
# under /storybook/. Turn Pages on once, in the repository's Settings >
# Pages, with "GitHub Actions" as the source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build-site
      - run: npx storybook build --quiet -o site-dist/storybook
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
